services:
  postgres:
    image: postgres:16-alpine
    container_name: hamro-postgres
    restart: unless-stopped
    environment:
      # Owner role. Runs migrations, owns every table, and is NOT subject to RLS.
      POSTGRES_USER: ${POSTGRES_USER:-hamro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamro}
      POSTGRES_DB: ${POSTGRES_DB:-hamro_school_dev}
      # Password for the RLS-restricted role the API connects as. See
      # docker/postgres/init/01-app-role.sql.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-hamro_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hamro-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamro} -d ${POSTGRES_DB:-hamro_school_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hamro-pgdata:
