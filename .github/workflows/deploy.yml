name: Deploy

on:
  # Deploys are deliberate. A push to main runs the tests; shipping is a button
  # someone presses, until there is enough test coverage to trust otherwise.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # request the OIDC token AWS trades for credentials

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Short SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── AWS, with no stored credentials ───────────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # ── The image ─────────────────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # The box is Graviton. Building for the wrong architecture gives you
          # a container that pulls perfectly and then exits with "exec format
          # error".
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:${{ steps.sha.outputs.value }}
            ${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find the instance
        id: target
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hamro-production" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" = "None" ] || [ -z "$instance" ]; then
            echo "No running instance tagged hamro-production. Has tofu apply run?" >&2
            exit 1
          fi
          echo "instance_id=$instance" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          SKIP_IMAGE_BUILD: '1' # built and pushed above
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REGION: ${{ vars.AWS_REGION }}
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
          REGISTRY: ${{ vars.ECR_REPOSITORY }}
        run: ./deploy/deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ steps.sha.outputs.value }}"
            echo ""
            echo "- Image: \`${{ vars.ECR_REPOSITORY }}:${{ steps.sha.outputs.value }}\`"
            echo "- Instance: \`${{ steps.target.outputs.instance_id }}\`"
            echo "- URL: https://${{ vars.APP_HOSTNAME }}"
          } >> "$GITHUB_STEP_SUMMARY"
