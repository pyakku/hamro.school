name: Reseed demo data

# Rebuilds the demo tenant on production. Deliberate, manual, and destructive:
# it deletes one school and seeds it again.
#
# Why this exists as a workflow rather than a script somebody runs: production
# Postgres publishes no ports, so it is reachable only from the compose network
# on the instance — not from a laptop, with or without a tunnel. And the runtime
# image cannot seed, because the Dockerfile prunes dev dependencies and the seed
# is TypeScript run through tsx. So the seed runs from the Dockerfile's *build*
# stage, in a one-off container, on that network.
#
# Demo data ages: the seed anchors on the day it runs, so a fortnight later the
# registers stop before today and the homework is all overdue. Running this
# before a demo is the intended cure.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reseed" to confirm — this DELETES the demo school'
        required: true
        default: ''

concurrency:
  group: deploy-production # never at the same time as a deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  reseed:
    if: github.event.inputs.confirm == 'reseed'
    # arm64, natively. The box is Graviton, and building arm64 on an x86
    # runner means QEMU emulating every compile — which took 221s of a 327s
    # deploy, most of it native modules like argon2. Free for public repos.
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # The build stage, which still has tsx, the Prisma CLI and prisma/*.ts.
      # Tagged separately from the runtime image so it can never be deployed by
      # accident: nothing in deploy.sh looks for a `seed-` tag.
      - name: Build the seed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: build
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:seed-${{ steps.sha.outputs.value }}
          cache-from: type=gha

      - name: Find the instance
        id: target
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.INSTANCE_TAG || 'hamro-production' }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" = "None" ] || [ -z "$instance" ]; then
            echo "No running instance." >&2
            exit 1
          fi
          echo "instance_id=$instance" >> "$GITHUB_OUTPUT"

      - name: Rebuild the demo school
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REGION: ${{ vars.AWS_REGION }}
          REGISTRY: ${{ vars.ECR_REPOSITORY }}
          TAG: seed-${{ steps.sha.outputs.value }}
          # seed.ts creates `modelschool` and nothing else, so there is no
          # slug input: offering one would imply a choice that does not exist.
          SLUG: modelschool
        run: |
          set -euo pipefail

          # Heredoc, then a JSON file: the CLI's `commands=` shorthand mangles
          # anything with commas or quotes in it.
          SCRIPT=$(cat <<SH
          set -euo pipefail
          cd /opt/hamro

          # The seed image carries dev dependencies and is far bigger than the
          # runtime one. This box is a t4g.micro; filling its disk would take
          # the site down, which is a poor trade for refreshing demo data.
          docker image prune -f >/dev/null 2>&1 || true
          avail=\$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: \${avail}G"
          if [ "\${avail}" -lt 6 ]; then
            echo "Not enough free disk for the seed image." >&2
            exit 1
          fi

          aws ecr get-login-password --region ${REGION} \
            | docker login --username AWS --password-stdin ${REGISTRY%%/*}
          docker pull --quiet ${REGISTRY}:${TAG}

          # xtrace stays off: the command line below carries the database URL,
          # and SSM output goes to CloudWatch.
          set +x
          echo "SEED_IMAGE=${REGISTRY}:${TAG}" > /opt/hamro/.env.seed
          set -a
          . /opt/hamro/.env
          . /opt/hamro/.env.seed
          set +a

          docker compose -f /opt/hamro/docker-compose.yml --profile seed run --rm seed \
            'node_modules/.bin/tsx prisma/reset-demo.ts ${SLUG} && node_modules/.bin/tsx prisma/seed.ts'

          rm -f /opt/hamro/.env.seed
          docker image rm ${REGISTRY}:${TAG} || true
          docker image prune -f >/dev/null 2>&1 || true
          SH
          )

          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > /tmp/params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Reseed ${SLUG}" \
            --parameters file:///tmp/params.json \
            --region "$REGION" \
            --query 'Command.CommandId' --output text)

          echo "SSM command $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$REGION" \
            || true

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$REGION" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output text

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$REGION" \
            --query 'Status' --output text)
          [ "$status" = "Success" ] || exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Reseeded \`modelschool\`"
            echo ""
            echo "The demo school was deleted and rebuilt, anchored on today."
            echo "Other tenants were untouched."
          } >> "$GITHUB_STEP_SUMMARY"
