name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The tests run against a real Postgres, because the things most worth
    # testing here — row-level security, an append-only grant, a partial unique
    # index — only exist in the database. A mock would agree with a bug.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hamro
          POSTGRES_PASSWORD: hamro
          POSTGRES_DB: hamro_school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The RLS-restricted role the API connects as. Created here exactly as
      # docker-compose creates it in development and production.
      - name: Create the application database role
        env:
          PGPASSWORD: hamro
          APP_DB_PASSWORD: hamro_app
        run: |
          psql -h localhost -U hamro -d hamro_school_test -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/01-app-role.sql

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          LOG_LEVEL=silent
          DATABASE_URL=postgresql://hamro_app:hamro_app@localhost:5432/hamro_school_test?schema=public
          MIGRATION_DATABASE_URL=postgresql://hamro:hamro@localhost:5432/hamro_school_test?schema=public
          API_PORT=4000
          API_HOST=127.0.0.1
          CORS_ORIGINS=http://localhost:5173
          JWT_ACCESS_SECRET=ci-only-access-secret-not-used-anywhere-real-000000
          JWT_REFRESH_SECRET=ci-only-refresh-secret-not-used-anywhere-real-00000
          VITE_API_URL=http://localhost:4000
          APP_BASE_DOMAIN=hamro.school
          VITE_BASE_DOMAIN=hamro.school
          EOF

      - run: pnpm --filter @hamro/api exec prisma generate
      - run: pnpm --filter @hamro/shared build
      - run: pnpm --filter @hamro/api exec prisma migrate deploy
      - run: pnpm --filter @hamro/api db:seed

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    # Proves the Dockerfile builds on every change. It does not push — only a
    # deploy from main does that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
